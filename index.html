<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Bachha ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.container {
    text-align: center;
    background: rgba(255,255,255,0.2);
    padding: 40px 25px;
    border-radius: 20px;
    backdrop-filter: blur(12px);
    box-shadow: 0 0 40px rgba(255,255,255,0.2),
                0 10px 40px rgba(0,0,0,0.25);
    max-width: 500px;
    width: 90%;
}

h1 {
    color: #fff;
    font-size: 1.8em;
    min-height: 70px;
}

.subtext {
    color: #fff;
    font-size: 14px;
    margin-bottom: 25px;
}

/* PERFECT ALIGNMENT */
.buttonArea {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 30px;
    height: 160px;
    position: relative;
}

/* buttons */
button {
    padding: 12px 22px;
    font-size: 16px;
    border-radius: 30px;
    border: none;
    cursor: pointer;
    transition: 0.3s ease;
}

/* yes */
#yesBtn {
    background: linear-gradient(45deg, #ff4d6d, #ff758f);
    color: white;
    box-shadow: 0 8px 25px rgba(255,77,109,0.6);
}

#yesBtn:hover {
    transform: scale(1.1);
}

/* no (initially NORMAL FLOW) */
#noBtn {
    background: linear-gradient(45deg, #f1f1f1, #ffffff);
    color: #444;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

/* balloons */
.balloon {
    position: absolute;
    bottom: -120px;
    width: 45px;
    height: 65px;
    border-radius: 50%;
    opacity: 0.9;
    animation: floatUp linear infinite;
}

.balloon:nth-child(3n) { background: #ff6b81; }
.balloon:nth-child(3n+1) { background: #ffb347; }
.balloon:nth-child(3n+2) { background: #6bd5ff; }

@keyframes floatUp {
    0% { transform: translateY(0); opacity: 1; }
    50% { transform: translateY(-50vh) translateX(20px) scale(1.1); }
    100% { transform: translateY(-110vh) translateX(-20px); opacity: 0; }
}

.gallery {
    margin-top: 25px;
    display: none;
    flex-direction: column;
    align-items: center;
}

.gallery img {
    width: 100%;
    max-width: 300px;
    border-radius: 15px;
    margin-bottom: 10px;
}

.galleryText {
    font-family: 'Great Vibes', cursive;
    font-size: 1.5em;
    color: white;
}

.finalText {
    font-family: 'Great Vibes', cursive;
    font-size: 2em;
    color: white;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="container" id="mainBox">
    <h1 id="title"></h1>
    <div class="subtext">You make my world softer, brighter, and so much prettier. Bas Bas isse jydaa angrezi palle nhi pdegi aapke. 💖</div>

    <div class="buttonArea" id="buttonArea">
        <button id="yesBtn">Yes Nikku ❤️</button>
        <button id="noBtn">😖</button>
    </div>

    <div class="gallery" id="gallery">
        <img src="MINE.jpeg" alt="us">
        <div class="galleryText">Wanna fill my gallery with photos like this with u.. 💖</div>
    </div>
</div>

<audio id="loveMusic" src="wanna be yours.mpeg"></audio>

<script>
const title = document.getElementById('title');
const noBtn = document.getElementById('noBtn');
const yesBtn = document.getElementById('yesBtn');
const music = document.getElementById('loveMusic');
const gallery = document.getElementById('gallery');
const area = document.getElementById('buttonArea');

// typing
const text = "Bachha ❤️, from the moment you came into my life, everything feels more beautiful... Will you be my girlfriend? 💖";
let i = 0;

function typeEffect() {
    if (i < text.length) {
        title.innerHTML += text.charAt(i);
        i++;
        setTimeout(typeEffect, 35);
    }
}
typeEffect();

// teasing
const teasingTexts = [
    "chup raho 😤",
    "soch lo 😏",
    "itna attitude? 😒",
    "mat dabao 😖",
    "acha ji? 😳",
    "no option 😌"
];

// movement (NO OVERLAP GUARANTEED)
function moveNoButton() {

    // switch to absolute ONLY when moving
    noBtn.style.position = "absolute";

    const areaRect = area.getBoundingClientRect();
    const yesRect = yesBtn.getBoundingClientRect();
    const btnRect = noBtn.getBoundingClientRect();

    let x, y;

    do {
        x = Math.random() * (areaRect.width - btnRect.width);
        y = Math.random() * (areaRect.height - btnRect.height);
    } while (
        x < (yesRect.right - areaRect.left + 20) &&
        x + btnRect.width > (yesRect.left - areaRect.left - 20) &&
        y < (yesRect.bottom - areaRect.top + 20) &&
        y + btnRect.height > (yesRect.top - areaRect.top - 20)
    );

    const rotate = Math.random() * 30 - 15;

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
    noBtn.style.transform = `rotate(${rotate}deg)`;

    noBtn.innerText = teasingTexts[Math.floor(Math.random() * teasingTexts.length)];
}

noBtn.addEventListener('mouseenter', moveNoButton);
noBtn.addEventListener('click', moveNoButton);

// yes click
yesBtn.addEventListener('click', () => {
    noBtn.remove();
    title.innerText = "Happy 2 months to us ❤️";

    music.play().catch(() => {});

    for (let j = 0; j < 25; j++) {
        let balloon = document.createElement('div');
        balloon.classList.add('balloon');

        balloon.style.left = Math.random() * window.innerWidth + 'px';
        balloon.style.animationDuration = (5 + Math.random() * 4) + 's';
        balloon.style.opacity = Math.random();

        document.body.appendChild(balloon);
    }

    gallery.style.display = "flex";

    const msg = document.createElement('div');
    msg.classList.add('finalText');
    msg.innerText = "I love you so much Bachha 💖";
    document.getElementById('mainBox').appendChild(msg);
});
</script>

</body>
</html>
